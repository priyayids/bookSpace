services:
  db:
    image: postgres:16-alpine
    container_name: bookspace-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-BookSpaceSecurePass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-bookspace}
    volumes:
      - bookspace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookspace} -d ${POSTGRES_DB:-bookspace}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bookspace_net

  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: bookspace-app
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bookspace}:${POSTGRES_PASSWORD:-BookSpaceSecurePass2026!}@db:5432/${POSTGRES_DB:-bookspace}?schema=public
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-bookspace-secret-jwt-key-production-2026}
      TIMEZONE: ${TIMEZONE:-Asia/Jakarta}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bookspace_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bookspace-frontend
    restart: always
    ports:
      - "127.0.0.1:3050:80"
    depends_on:
      - app
    networks:
      - bookspace_net

volumes:
  bookspace_pgdata:
    name: bookspace_pgdata

networks:
  bookspace_net:
    name: bookspace_net
